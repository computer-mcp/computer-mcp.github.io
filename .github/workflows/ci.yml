name: Website CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up catalog publisher Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate catalog publisher policy
        run: npm run catalog:check-policy

      - name: Check formatting
        run: npm run format:check

      - name: Validate HTML
        run: npm run check:html

      - name: Build production site
        run: npm run build

      - name: Validate links
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:links

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility and smoke tests
        run: npm test

  brand:
    uses: computer-mcp/.github/.github/workflows/brand-check.yml@43abe15c93db0a0731f81bf806edd89a7a5b2136 # master
