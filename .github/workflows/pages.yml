name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1353589608' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pages: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Record current source
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up catalog publisher Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify catalog seed
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run:
          python3 scripts/plugin_catalog_publication.py --check-seed --expected-head
          "$CATALOG_SOURCE_COMMIT"

      - name: Reconcile all official plugin releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run catalog:update -- --require-existing

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Verify website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run fonts:check
          npm run release:check
          npm run catalog:check-policy
          npm run catalog:check
          npm run format:check
          npm run check:html
          npm run build
          npm run check:links

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility and smoke tests
        run: npm test

      - name: Prepare verified catalog generation
        id: catalog
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 scripts/plugin_catalog_publication.py --expected-head "$CATALOG_SOURCE_COMMIT"

      - name: Merge catalog proposal
        if: steps.catalog.outputs.proposal != ''
        env:
          BRANCH: automation/plugin-catalog
          GH_TOKEN: ${{ github.token }}
          PROPOSAL: ${{ steps.catalog.outputs.proposal }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$(git log -1 --format=%s "$PROPOSAL")
          body="Generated from current official plugin releases by [the Pages workflow]($RUN_URL). The catalog successor, publisher policy and built site were verified before this proposal. Website CI runs on this branch, the pull request merges automatically once it passes, and the same run then deploys the merged generation."
          number=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            number=$(gh pr create --head "$BRANCH" --base master --title "$title" --body "$body" | sed 's#.*/##')
          fi
          if [[ "$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest == null')" == true ]]; then
            gh pr merge "$number" --auto --squash
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          for _ in $(seq 80); do
            state=$(gh pr view "$number" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
            [[ "$state" == "MERGED $PROPOSAL" ]] && exit 0
            [[ "$state" == "OPEN $PROPOSAL" ]] || break
            sleep 15
          done
          echo "Catalog proposal #$number is not merged ($state); the deployed site is retained." >&2
          exit 1

      - name: Verify merged catalog generation
        if: steps.catalog.outputs.proposal != ''
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          PROPOSAL: ${{ steps.catalog.outputs.proposal }}
        run:
          python3 scripts/plugin_catalog_publication.py --expected-head "$CATALOG_SOURCE_COMMIT"
          --merged "$PROPOSAL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
